# Il décrit à Docker comment lancer le container Grafana 
# quelle image utiliser, quels ports ouvrir, quels plugins installer et quels dossiers partager entre le PC et le container.

version: "3.8"

services:
  grafana:
    image: grafana/grafana:latest # télécharge et utilise dernière ver grafana
    container_name: grafana-iot # nom container 
    restart: unless-stopped # si container plante, docker le redémarre automatiquement
    ports:
      - "3000:3000" # Relie port 3000 du container au port 3000 du pc
    environment:
      - GF_SECURITY_ADMIN_USER=admin # mdp et user par défaut pour se connecter
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=frser-sqlite-datasource # installation plugin sqlite au démarrage pour que grafana lise la bdd
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning # indique à grafana où trouver fichiers de configs automatique (dashboard, datasource)
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning # monte dossier provisioning, contient config datasource sqlite et dashboard
      - ./grafana/dashboards:/var/lib/grafana/dashboards # monte dossier dashboard (iot_dashboard.json)
      - ../serveur:/var/lib/grafana/data # monte dossier serveur pc dans le container, grafana accède à la bdd
      - grafana-storage:/var/lib/grafana # stocke données internes de grafana entre les redémarrages 

volumes:
  grafana-storage:
